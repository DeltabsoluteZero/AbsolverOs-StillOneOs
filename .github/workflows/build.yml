name: Build AbsolverOs APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Guest Manager & Main Debug APK
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pwd
          ls -la
          mkdir -p out/overlays
          if [ -f "scripts/build-guest-manager.sh" ]; then
            chmod +x scripts/build-guest-manager.sh
            ./scripts/build-guest-manager.sh --debug
          else
            cd app-android
            chmod +x gradlew
            ./gradlew :guest:assembleDebug
            mkdir -p ../switcher/assets
            cp guest/build/outputs/apk/debug/guest-debug.apk ../switcher/assets/guest_manager.apk
            cd ..
          fi
          cd app-android
          chmod +x gradlew
          ./gradlew assembleFullDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbsolverOs-debug
          path: "**/build/outputs/apk/**/*.apk"
