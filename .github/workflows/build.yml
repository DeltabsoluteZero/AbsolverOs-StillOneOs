name: Build AbsolverOS (pudding)
on:
  push: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }

      - name: Android SDK manually at /opt/android-sdk + tools
        run: |
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          curl -sL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q /tmp/clt.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          yes | sudo /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          # e2fsprogs/zip/unzip ship with ubuntu-latest; erofs-utils is optional (only GMS payloads need it)
          command -v debugfs && command -v unzip
          sudo apt-get install -y erofs-utils || echo "erofs-utils unavailable - OK for the HyperOS set"
          curl -Lo ~/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "APKTOOL=$HOME/apktool.jar" >> $GITHUB_ENV
          echo "EXTRACT_EROFS=$(command -v extract.erofs || true)" >> $GITHUB_ENV

      - name: Fetch pudding image from Google Drive folder
        run: |
          python3 -m pip install -q gdown
          gdown --folder "https://drive.google.com/drive/folders/1p1y4Rmm0Do1TYejAF_Kzjlj9rj5l5fv0"
          GZ=$(find . -maxdepth 3 \( -name '*.img.gz' -o -name '*.gz' \) | head -1)
          ZIP=$(find . -maxdepth 3 -name '*.zip' | head -1)
          if [ -n "$GZ" ]; then
            gunzip -c "$GZ" > system.img && rm -f "$GZ"
          elif [ -n "$ZIP" ]; then
            unzip -o "$ZIP" || true
            GZ=$(find . -maxdepth 3 \( -name '*.img.gz' -o -name '*.gz' \) | head -1)
            [ -n "$GZ" ] && { gunzip -c "$GZ" > system.img && rm -f "$GZ"; }
          fi
          if [ ! -s system.img ]; then
            IMG=$(find . -maxdepth 3 -name 'system.img' | head -1)
            [ -s "$IMG" ] && mv "$IMG" system.img
          fi
          [ -s system.img ] || { echo "no system.img / .gz found in the Drive folder"; exit 1; }
          echo "e0ff2bcb4198d2c23b35e29b7e02a0d0426626a60e2be65973a3982ea61864be  system.img" | sha256sum -c -
          df -h . | tail -1
          
      - name: Undo the accidental rename
        run: |
          [ -f "scripts/build-guest-manager.sh --debug" ] && mv "scripts/build-guest-manager.sh --debug" scripts/build-guest-manager.sh || true
          
      - name: Gradle credentials for GitHub Packages (SESL libs)
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.gradle
          printf 'gpr.user=%s\ngpr.key=%s\ngprUser=%s\ngprKey=%s\n' \
            "$GH_USER" "$GH_TOKEN" "$GH_USER" "$GH_TOKEN" >> ~/.gradle/gradle.properties
          chmod 600 ~/.gradle/gradle.properties
          
      - name: Stage guest manager (sign with our own release key)
        run: |
          mkdir -p ~/.oneos-release
          keytool -genkeypair -keystore ~/.oneos-release/oneos.jks -storepass oneos123 \
            -alias oneos -keypass oneos123 -dname "CN=AbsolverOS" -keyalg RSA -keysize 2048 -validity 10000
          echo "storeFile=$HOME/.oneos-release/oneos.jks" > ~/.oneos-release/keystore.properties
          echo "storePassword=oneos123" >> ~/.oneos-release/keystore.properties
          echo "keyAlias=oneos" >> ~/.oneos-release/keystore.properties
          echo "keyPassword=oneos123" >> ~/.oneos-release/keystore.properties
          bash scripts/build-guest-manager.sh release \
            || bash scripts/build-guest-manager.sh debug \
            || bash scripts/build-guest-manager.sh
          ls -l switcher/assets/guest_manager.apk

      - name: Generate the matching patch set
        run: bash scripts/make-overlays.sh system.img out/overlays_hyperos_r25

      - run: rm -f system.img   # free runner disk

      - name: Register as a test set (debug only)
        run: |
          mkdir -p /tmp/pkg && cp app-android/packages/* /tmp/pkg/
          ( cd out/overlays_hyperos_r25
            for f in *; do [ "$f" = tethering_payload.img ] && continue
              printf '%s%s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f"; done ) > /tmp/pkg/hyper-f8u.sha256
          echo "hyper hyper-f8u" > /tmp/pkg/series.txt

      - name: Build APK with the set packed in
        run: |
          cd app-android
          ./gradlew assembleFullDebug --no-daemon \
            -Poneos.testPackagesDir=/tmp/pkg -Poneos.series=hyper -Poneos.packSets=true

      - uses: actions/upload-artifact@v4
        with:
          name: AbsolverOS-pudding
          path: app-android/app/build/outputs/apk/full/debug/*.apk
