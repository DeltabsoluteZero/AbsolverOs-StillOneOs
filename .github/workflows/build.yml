name: Build AbsolverOs APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Find gradlew and build APK
        run: |
          mkdir -p out/overlays
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          cd "$(dirname "$GRADLEW_PATH")"
          ./gradlew assembleDebug || ./gradlew assembleFullDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbsolverOs-debug
          path: "**/build/outputs/apk/**/*.apk"

