name: Build AbsolverOs APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Guest Manager APK
        run: |
          mkdir -p out/overlays
          chmod +x scripts/build-guest-manager.sh
          ./scripts/build-guest-manager.sh

      - name: Build Main Debug APK
        working-directory: app-android
        run: |
          chmod +x gradlew
          ./gradlew assembleFullDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbsolverOs-debug
          path: app-android/**/build/outputs/apk/**/*.apk
