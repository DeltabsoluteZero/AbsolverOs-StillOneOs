name: Build AbsolverOS (pudding0.4.89)
on:
  push: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
        
      - name: Setup Android directories
        run: |
          mkdir -p ~/.android
          mkdir -p ~/.config/.android
          chmod -R 755 ~/.android ~/.config/.android
          
      - name: Android SDK manually at /opt/android-sdk + tools
        run: |
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          curl -sL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q /tmp/clt.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          yes | sudo /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          # e2fsprogs/zip/unzip ship with ubuntu-latest; erofs-utils is optional (only GMS payloads need it)
          command -v debugfs && command -v unzip
          sudo apt-get install -y erofs-utils || echo "erofs-utils unavailable - OK for the HyperOS set"
          curl -Lo ~/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          mkdir -p mysticgsi/tools/apktool
          cp ~/apktool.jar mysticgsi/tools/apktool/apktool.jar
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "APKTOOL=$HOME/apktool.jar" >> $GITHUB_ENV
          echo "EXTRACT_EROFS=$(command -v extract.erofs || true)" >> $GITHUB_ENV

      - name: Gradle credentials for GitHub Packages (SESL libs)
        env:
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$GPR_KEY" ]; then
            echo "::error::PACKAGES_TOKEN secret is EMPTY or not set — create a classic PAT with read:packages and add it as repo secret PACKAGES_TOKEN"
            exit 1
          fi
          echo "token length: ${#GPR_KEY}"
          # confirm the token is real and has the scope, independent of Gradle
          curl -s -D - -o /dev/null -H "Authorization: Bearer $GPR_KEY" https://api.github.com/user \
            | grep -i '^x-oauth-scopes:' || echo "no x-oauth-scopes header (token may be invalid)"
          echo "GPR_USER=$GPR_USER" >> $GITHUB_ENV
          echo "GPR_KEY=$GPR_KEY"   >> $GITHUB_ENV
          mkdir -p ~/.gradle/init.d
          { echo "gpr.user=$GPR_USER";  echo "gpr.key=$GPR_KEY";
            echo "gprUser=$GPR_USER";   echo "gprKey=$GPR_KEY";
            echo "GITHUB_USER=$GPR_USER"; echo "GITHUB_TOKEN=$GPR_KEY"; } >> ~/.gradle/gradle.properties
          # also expose as -D system props for any build that reads them
          echo "GRADLE_OPTS=-Dgpr.user=$GPR_USER -Dgpr.key=$GPR_KEY -DgprUser=$GPR_USER -DgprKey=$GPR_KEY" >> $GITHUB_ENV
          cat > ~/.gradle/init.d/gpr.gradle <<'EOF'
          def u = System.getenv('GPR_USER'); def k = System.getenv('GPR_KEY')
          if (u && k) {
            def fix = { repos -> repos.all { r ->
              if (r instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
                  && r.url.toString().contains('maven.pkg.github.com')) {
                r.credentials { username = u; password = k }
              }
            } }
            settingsEvaluated { s -> fix(s.pluginManagement.repositories); fix(s.dependencyResolutionManagement.repositories) }
            allprojects { p -> fix(p.repositories) }
          }
          EOF
          chmod 600 ~/.gradle/gradle.properties ~/.gradle/init.d/gpr.gradle
      
      - name: Cache pudding image archive
        id: pudcache
        uses: actions/cache@v4
        with:
          path: pudding.bin
          key: pudding-absolver-v2

      - name: Seed pudding archive (cache miss only)
        if: steps.pudcache.outputs.cache-hit != 'true'
        env:
          PD_KEY: ${{ secrets.PD_API_KEY }}
        run: |
          URL_SF="https://sourceforge.net/projects/mystic-gsi-updates/files/HyperOS/Hyperos-pudding-16-OS3.0.50.2.W-AB-20260122-MysticGSI.zip/download"
          URL_PD="https://pixeldrain.com/api/file/XkWxFdSw?download"
          SEED_OK=0
          if [ -n "$PD_KEY" ]; then
            echo "trying PixelDrain (authed, fast)"
            curl -L --retry 8 --retry-all-errors --retry-delay 5 --continue-at - -H "Authorization: Bearer $PD_KEY" -o pudding.bin.part "$URL_PD" 2>/dev/null
            if file pudding.bin.part | grep -qE "gzip|Zip archive"; then
              echo "PD seed succeeded"
              mv pudding.bin.part pudding.bin
              SEED_OK=1
            else
              echo "PD returned non-archive (captcha wall); falling back to SourceForge"
              rm -f pudding.bin.part
            fi
          fi
          if [ "$SEED_OK" -eq 0 ]; then
            echo "seeding via SourceForge (slower, still one-time)"
            curl -L --retry 8 --retry-all-errors --retry-delay 5 --continue-at - -o pudding.bin.part "$URL_SF"
            if file pudding.bin.part | grep -qE "gzip|Zip archive"; then
              mv pudding.bin.part pudding.bin
            else
              rm -f pudding.bin.part
              echo "both PD and SF failed to deliver an archive"
              exit 1
            fi
          fi

      - name: Extract + report pudding image
        run: |
          if gunzip -t pudding.bin 2>/dev/null; then
            gunzip -c pudding.bin > system.img
          else
            mkdir -p _x && unzip -o pudding.bin -d _x >/dev/null 2>&1 || true
            IMG=$(find _x -maxdepth 4 -type f -name system.img | head -1)
            if [ -n "$IMG" ]; then mv "$IMG" system.img; else G=$(find _x -maxdepth 4 -type f -name "*.img.gz" | head -1); [ -n "$G" ] && gunzip -c "$G" > system.img; fi
          fi
          [ -s system.img ] || { echo "no system.img after extract"; ls -la; [ -d _x ] && find _x -maxdepth 4 -type f | head -20; exit 1; }
          ACTUAL=$(sha256sum system.img | cut -d" " -f1)
          echo "system.img sha256 = $ACTUAL"
          EXP="e0ff2bcb4198d2c23b35e29b7e02a0d0426626a60e2be65973a3982ea61864be"
          if [ "$ACTUAL" = "$EXP" ]; then echo "SHA MATCH"; else echo "SHA DIFFERS (expected $EXP) - bytes cached; patchers act on jars INSIDE, so a different outer sha is usually harmless; if make-overlays rejects it we change the seed source WITHOUT re-downloading"; fi

      - name: Stage guest manager (release-signed; the script stages the apk)
        run: |
          JKS="$HOME/.oneos-release/oneos.jks"
          mkdir -p "$(dirname "$JKS")"
          [ -f "$JKS" ] || keytool -genkeypair -keystore "$JKS" -storepass oneos123 -alias oneos -keypass oneos123 -dname "CN=AbsolverOS" -keyalg RSA -keysize 2048 -validity 10000
          for d in "$HOME/.oneos-release" "$PWD/oneos-release" "$PWD/../oneos-release"; do
            mkdir -p "$d" 2>/dev/null || true
            printf 'storeFile=%s\nstorePassword=oneos123\nkeyAlias=oneos\nkeyPassword=oneos123\n' "$JKS" > "$d/keystore.properties"
          done
          bash scripts/build-guest-manager.sh release
          SRC=switcher/assets/guest_manager.apk
          mkdir -p app-android/switcher/assets
          cp -f "$SRC" app-android/switcher/assets/guest_manager.apk 2>/dev/null || true
          echo "== diagnostics =="; pwd
          ls -la scripts/build-guest-manager.sh
          ls -la "$SRC" app-android/switcher/assets/guest_manager.apk 2>/dev/null
          ls -la app-android/guest/build/outputs/apk/release/ 2>/dev/null | head
          sha256sum "$SRC" app-android/switcher/assets/guest_manager.apk app-android/guest/build/outputs/apk/release/guest-release.apk 2>/dev/null

      - name: Generate the matching patch set
        run: bash scripts/make-overlays.sh system.img out/overlays_hyperos_r25

      - run: rm -f system.img   # free runner disk

      - name: Register as a test set (debug only)
        run: |
          mkdir -p $GITHUB_WORKSPACE/app-android/_pkg_tmp && cp app-android/packages/* $GITHUB_WORKSPACE/app-android/_pkg_tmp/
          ( cd out/overlays_hyperos_r25
            for f in *; do [ "$f" = tethering_payload.img ] && continue
              sha256sum "$f"; done ) > $GITHUB_WORKSPACE/app-android/_pkg_tmp/hyper-f8u.sha256
          echo "hyper hyper-f8u" > $GITHUB_WORKSPACE/app-android/_pkg_tmp/series.txt
          
      - name: Ensure .android dir exists
        run: |
          mkdir -p ~/.android
          mkdir -p ~/.config/.android
          chmod -R 755 ~/.android ~/.config/.android
          echo "ANDROID_SDK_HOME=$HOME/.android" >> $GITHUB_ENV
        
      - name: Build APK with the set packed in
        run: |
          cd app-android
          ./gradlew assembleFullDebug --no-daemon \
            -Poneos.testPackagesDir=$GITHUB_WORKSPACE/app-android/_pkg_tmp -Poneos.series=hyper -Poneos.packSets=true

      - uses: actions/upload-artifact@v4
        with:
          name: AbsolverOS-pudding
          path: app-android/app/build/outputs/apk/full/debug/*.apk
