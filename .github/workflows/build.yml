name: Build AbsolverOs APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Guest Manager & Main Debug APK
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SCRIPT_PATH=$(find . -name "build-guest-manager.sh" | head -n 1)
          REPO_ROOT=$(cd "$(dirname "$SCRIPT_PATH")/.." && pwd)
          echo "Detected Repo Root: $REPO_ROOT"
          cd "$REPO_ROOT"
          mkdir -p out/overlays
          chmod +x scripts/build-guest-manager.sh
          ./scripts/build-guest-manager.sh --debug
          cd app-android
          chmod +x gradlew
          ./gradlew assembleFullDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbsolverOs-debug
          path: "**/build/outputs/apk/**/*.apk"
